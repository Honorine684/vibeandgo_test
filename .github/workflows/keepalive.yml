name: keep-backend-warm

# Empeche le backend Render (tier gratuit) de spin-down apres ~15 min d'inactivite.
# Le cold-start de ~50s faisait tomber les findings API (DELETE/PUT, SQLi) dans le
# bandeau "re-scan to confirm" du scanner et allongeait la duree de scan.
# GitHub planifie les crons "au mieux" (souvent 5-15 min de retard sous charge) :
# suffisant en pratique, et on peut toujours reveiller a la main avant un scan
# via l'onglet Actions -> Run workflow.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend root
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 \
              https://vibeandgo-backend.onrender.com/ || echo "000")
            echo "attempt $i -> $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "backend did not return 200 (may still be waking) - not failing the job"
